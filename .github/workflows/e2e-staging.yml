name: E2E Staging

on:
  workflow_dispatch:

jobs:
  e2e-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run staging E2E
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_HEADLESS: "true"
          E2E_ARTIFACT_DIR: tests/e2e/artifacts
        run: pytest -c tests/e2e/pytest.ini tests/e2e/specs -m smoke -q

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-artifacts
          path: tests/e2e/artifacts
          if-no-files-found: warn
