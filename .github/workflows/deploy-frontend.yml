name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard test env files
        run: |
          set -euo pipefail
          BLOCKED="$(git ls-files 'tests/**/.env*' ':!:tests/**/.env.example')"
          if [ -n "$BLOCKED" ]; then
            echo "Blocked committed env files under tests/:"
            echo "$BLOCKED"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  # ── 2. Type-check ─────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check

  # ── 3. Tests ──────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ── 4. Build static export ────────────────────────────────
  build:
    name: Build Static Export
    runs-on: ubuntu-latest
    needs: [lint, test, type-check]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Staging build — API points at staging backend
      - name: Build for Staging
        if: github.ref == 'refs/heads/develop'
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_STAGING || 'https://crm-api-staging.adibasyraaf.com/api/v1' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL_STAGING || 'https://titanjournal-staging.adibasyraaf.com' }}
        run: pnpm build

      # Production build
      - name: Build for Production
        if: github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.titanjournal.vip/api/v1' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://titanjournal.vip' }}
        run: pnpm build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 1

  # ── 5. Deploy to Staging Pages ────────────────────────────
  deploy-staging:
    name: Deploy → titanjournal-crm-staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    environment:
      name: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: titanjournal-crm-staging

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out/

      - name: Validate Cloudflare staging config
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "Missing CLOUDFLARE_API_TOKEN (staging environment secret)"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "Missing CLOUDFLARE_ACCOUNT_ID (staging environment secret)"; exit 1; }
          CF_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}"
          HTTP_CODE="$(curl -sS -o cf-preflight.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$CF_URL")"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Cloudflare preflight HTTP ${HTTP_CODE}. Check account/token/project mapping for staging."
            cat cf-preflight.json
            exit 1
          fi
          jq -e '.success == true' cf-preflight.json >/dev/null || {
            echo "Cloudflare preflight failed. Check account/token/project mapping for staging.";
            jq -r '.errors // []' cf-preflight.json;
            exit 1;
          }

      - name: Deploy to Cloudflare Pages (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name ${{ env.CF_PAGES_PROJECT }}

  # ── 6. Deploy to Production Pages ────────────────────────
  deploy-production:
    name: Deploy → titanjournal
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: titanjournal

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out/

      - name: Validate Cloudflare production config
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "Missing CLOUDFLARE_API_TOKEN (production environment secret)"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "Missing CLOUDFLARE_ACCOUNT_ID (production environment secret)"; exit 1; }
          CF_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}"
          HTTP_CODE="$(curl -sS -o cf-preflight.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$CF_URL")"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Cloudflare preflight HTTP ${HTTP_CODE}. Check account/token/project mapping for production."
            cat cf-preflight.json
            exit 1
          fi
          jq -e '.success == true' cf-preflight.json >/dev/null || {
            echo "Cloudflare preflight failed. Check account/token/project mapping for production.";
            jq -r '.errors // []' cf-preflight.json;
            exit 1;
          }

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name ${{ env.CF_PAGES_PROJECT }}
